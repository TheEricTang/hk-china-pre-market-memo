name: Daily HK China memo
run-name: ${{ inputs.dry_run && 'Memo validation rehearsal' || 'Daily HK China memo' }}

on:
  # Re-saving this workflow on main is an explicit recovery trigger. The path
  # filter prevents the memo commit below from starting a second run.
  push:
    branches:
      - main
    paths:
      - .github/workflows/daily-memo.yml
      - .github/memo-kick.txt
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate and review an edition without committing or publishing it
        required: true
        default: false
        type: boolean
      automatic:
        description: Respect HK trading days and skip generation of an existing edition
        required: true
        default: false
        type: boolean
      generate:
        description: Generate a new memo before deployment
        required: true
        default: true
        type: boolean
      edition_mode:
        description: Edition to generate
        required: true
        default: preopen
        type: choice
        options:
          - preopen
          - intraday
  schedule:
    # GitHub cron is expressed in UTC. Hong Kong does not observe DST.
    - cron: "40 22 * * *" # 06:40 HKT
    - cron: "52 22 * * *" # 06:52 HKT retry
    - cron: "4 23 * * *"  # 07:04 HKT final retry

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ inputs.dry_run && format('memo-validation-{0}', github.ref) || 'daily-memo' }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MEMO_AUTOMATIC: ${{ github.event_name != 'workflow_dispatch' || inputs.automatic }}
    environment:
      name: ${{ inputs.dry_run && 'memo-validation' || 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest published state
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"
      - name: Decide whether this run should publish
        id: publish
        env:
          AUTOMATIC: ${{ inputs.automatic }}
          GENERATE: ${{ inputs.generate }}
        run: python scripts/publication_plan.py
      - uses: actions/setup-python@v5
        if: steps.publish.outputs.required == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.publish.outputs.required == 'true'
        run: pip install -r requirements.txt
      - name: Run regression tests
        if: steps.publish.outputs.required == 'true'
        run: |
          python -m unittest discover -s tests -v
          node --test scheduler/worker.test.mjs
      - name: Recheck generation deadline after setup
        if: steps.publish.outputs.generate_required == 'true'
        env:
          AUTOMATIC: ${{ inputs.automatic }}
          GENERATE: ${{ inputs.generate }}
        run: python scripts/publication_plan.py
      - name: Generate and validate memo
        timeout-minutes: 24
        if: steps.publish.outputs.generate_required == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-sol
          EDITION_MODE: ${{ github.event_name == 'workflow_dispatch' && !inputs.automatic && inputs.edition_mode || 'preopen' }}
          MEMO_VALIDATE_ONLY: ${{ inputs.dry_run && 'true' || 'false' }}
        run: python scripts/generate_memo.py
      - name: Build public site
        if: steps.publish.outputs.required == 'true' && !inputs.dry_run
        run: python scripts/build_site.py
      - name: Check approved edition before publication
        if: steps.publish.outputs.required == 'true' && !inputs.dry_run
        run: python scripts/verify_publication.py --local-only
      - name: Save successful memo
        if: steps.publish.outputs.generate_required == 'true' && !inputs.dry_run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memos docs
          git diff --cached --quiet || git commit -m "memo: $(TZ=Asia/Hong_Kong date +%F)"
          git push
      - uses: actions/configure-pages@v5
        if: steps.publish.outputs.required == 'true' && !inputs.dry_run
      - uses: actions/upload-pages-artifact@v3
        if: steps.publish.outputs.required == 'true' && !inputs.dry_run
        with:
          path: docs
      - name: Deploy GitHub Pages
        if: steps.publish.outputs.required == 'true' && !inputs.dry_run
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live public edition and quality receipt
        if: steps.publish.outputs.required == 'true' && !inputs.dry_run
        run: python scripts/verify_publication.py
      - name: Record dry-run outcome
        if: inputs.dry_run && steps.publish.outputs.generate_required == 'true' && success()
        run: echo "Dry run completed; candidate passed independent review. No changes committed or published." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve generation audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memo-audit-${{ github.run_id }}-${{ github.run_attempt }}
          # Contains public-source audit metadata only; public repo readers can download it.
          path: |
            artifacts/memo-audit.json
            artifacts/memo-candidate.md
            artifacts/publication-verification.json
          if-no-files-found: ignore
          retention-days: 14
