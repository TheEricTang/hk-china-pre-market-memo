name: Public reviewer tools checks
on:
  pull_request:
    paths: ['docs/v2/**', 'tests/test_reviewer.mjs', '.github/workflows/reviewer-tools-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify copying, ordering and feedback isolation
        run: node --test tests/test_reviewer.mjs
